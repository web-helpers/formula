# https://moonrepo.dev/docs/config/tasks
$schema: 'https://moonrepo.dev/schemas/project.json'

type: 'library'
language: 'javascript'

id: 'docs-site'

project:
  name: 'formula'
  description: 'Formula library'
  channel: ''
  owner: 'tanepiper'
  maintainers: ['tanepiper']

tasks:
  dev:
    local: true
    command: 'npm run dev'
    inputs:
      - 'docs/**/*'
      - 'package.json'
    outputs:
      - 'types'
  build:
    local: true
    command: 'npm run build'
    inputs:
      - 'package.json'
